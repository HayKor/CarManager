product:
  type: kmp/lib
  platforms: [ android ]

apply:
  - //common.module-template.yaml
  - //metro.module-template.yaml
  - //ktlint.module-template.yaml

dependencies:
  # modules
  - //core/domain: exported
  - //core/result: exported
  # libs
  - $libs.kotlinx.coroutines.core: exported
  - $libs.androidx.room.runtime: exported
  - $libs.androidx.sqlite.bundled

settings:
  kotlin:
    ksp:
      processors:
        - $libs.androidx.room.compiler
      processorOptions:
        room.schemaLocation: ./schemas
