product:
  type: kmp/lib
  platforms: [ android ]

apply:
  - //common.module-template.yaml
  - //metro.module-template.yaml
  - //ktlint.module-template.yaml

dependencies:
  # modules
  - //core/design-system
  - //core/domain: exported
  - //core/presentation: exported
  - //core/resources
  - //core/ui: exported
  # libs
  - $libs.decompose.extensions.compose
  - $compose.preview
  - $libs.filekit.dialogs.compose
  - $libs.filekit.coil: exported
  - $libs.coil.compose

dependencies@android:
  - $compose.uiTooling

settings:
  compose: enabled
  android:
    minSdk: 26 # IDEA ругалась
  kotlin:
    freeCompilerArgs:
      - -XXLanguage:+ExplicitBackingFields
